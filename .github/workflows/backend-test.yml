name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimconnect
          POSTGRES_PASSWORD: nimconnect
          POSTGRES_DB: nimconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://nimconnect:nimconnect@localhost:5432/nimconnect_test?sslmode=disable
      DATABASE_URL: postgres://nimconnect:nimconnect@localhost:5432/nimconnect_test?sslmode=disable

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go test ./... -count=1
